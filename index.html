<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stammbaum</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
    <script>
      // Gespeichertes Design sofort setzen, damit die Seite nicht kurz hell aufblitzt.
      try {
        var t = localStorage.getItem('stammbaum-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Safari zoomt sonst trotz user-scalable=no die ganze Seite; gezoomt wird nur im Baum.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
